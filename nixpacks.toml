# Railway deployment configuration for Flask API
# Deploy from repository root, then cd into Flask app directory

[phases.setup]
nixPkgs = ["python313"]

[phases.install]
cmds = [
    "cd scripts/battlegroup/web && pip install -r requirements.txt"
]

[phases.build]
cmds = [
    "mkdir -p scripts/battlegroup/web/database",
    "cp database/master_database.db scripts/battlegroup/web/database/ 2>/dev/null || echo 'Note: Database will be uploaded via Railway dashboard'"
]

[start]
cmd = "cd scripts/battlegroup/web && python railway_app.py"
