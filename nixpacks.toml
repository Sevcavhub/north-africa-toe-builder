# Railway deployment configuration for Flask API
# Root directory: scripts/battlegroup/web/

[phases.setup]
nixPkgs = ["python313"]

[phases.install]
cmds = [
    "pip install -r requirements.txt"
]

[phases.build]
cmds = [
    "mkdir -p database",
    "cp ../../../database/master_database.db database/ 2>/dev/null || echo 'Note: Database will be uploaded via Railway dashboard'"
]

[start]
cmd = "python railway_app.py"
