<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BattleGroup V6.1 Datacards - Interactive Builder</title>
    <style>
        @page { size: A4 landscape; margin: 1cm; }
        @media print {
            body { margin: 0; }
            .page-break { page-break-after: always; }
        }
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
        }
        .datacards-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .datacard {
            background: white;
            border: 3px solid #333;
            border-radius: 8px;
            padding: 16px;
            page-break-inside: avoid;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .datacard.datacard-german {
            background-color: #c4c4c4;
            border-color: #333;
        }
        .datacard.datacard-german th {
            background-color: #666;
            color: white;
        }
        .datacard.datacard-german td {
            background-color: #e8e8e8;
            color: #1a1a1a;
        }
        .datacard.datacard-british {
            background-color: #d4c4a0;
            border-color: #4a3a2a;
        }
        .datacard.datacard-british th {
            background-color: #6b5d3f;
            color: white;
        }
        .datacard.datacard-british td {
            background-color: #f0e8d0;
            color: #1a1a1a;
        }
        .datacard.datacard-italian {
            background-color: #739A64;
            border-color: #5a4a2a;
        }
        .datacard.datacard-italian th {
            background-color: #6b5d3f;
            color: white;
        }
        .datacard.datacard-italian td {
            background-color: #e8dcc0;
            color: #1a1a1a;
        }
        .datacard.datacard-american {
            background-color: #b8c5a0;
            border-color: #3a4a2a;
        }
        .datacard.datacard-american th {
            background-color: #5a6d45;
            color: white;
        }
        .datacard.datacard-american td {
            background-color: #dce8cf;
            color: #1a1a1a;
        }
        .datacard.datacard-french {
            background-color: #b8c4d4;
            border-color: #2a3a4a;
        }
        .datacard.datacard-french th {
            background-color: #4a5a6d;
            color: white;
        }
        .datacard.datacard-french td {
            background-color: #d8e4f4;
            color: #1a1a1a;
        }
        .datacard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 2px solid #333;
        }
        .datacard-title {
            font-size: 20px;
            font-weight: bold;
        }
        .datacard-points {
            font-size: 16px;
            font-weight: bold;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 10px;
        }
        th, td {
            border: 1px solid #333;
            padding: 6px;
            text-align: center;
            font-size: 13px;
        }
        th {
            font-weight: bold;
        }
        .special-rules {
            font-style: italic;
            font-size: 12px;
            margin-top: 8px;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="datacards-container">
<div class="datacard"><p>Error: Could not generate datacard for Crusader I</p></div>
    </div>
</body>
</html>
