<!DOCTYPE html>
<html>
<head>
    <title>Test OSJones Fix Locally</title>
</head>
<body>
    <h1>Test OSJones Event Listener Fix</h1>

    <form id="osjonesDatacardForm">
        <label>Army List:</label><br>
        <textarea id="osjonesArmyList" rows="5" cols="60"></textarea><br>
        <button type="submit">Generate Datacards</button>
    </form>

    <div id="osjonesLoading" style="display: none;">Loading...</div>
    <div id="osjonesResults" style="display: none;">
        <div id="osjonesOutput"></div>
    </div>

    <script>
        const API_URL = 'https://north-africa-toe-api.onrender.com';

        function showLoading(id) {
            document.getElementById(id).style.display = 'block';
        }

        function hideLoading(id) {
            document.getElementById(id).style.display = 'none';
        }

        function showResults(id, data, success) {
            const resultsEl = document.getElementById(id);
            const outputEl = document.getElementById('osjonesOutput');
            outputEl.textContent = JSON.stringify(data, null, 2);
            resultsEl.style.display = 'block';
        }

        function hideResults(id) {
            document.getElementById(id).style.display = 'none';
        }

        // Wait for DOM to be ready
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM Content Loaded - attaching event listener');

            const form = document.getElementById('osjonesDatacardForm');
            console.log('Form element:', form);

            form.addEventListener('submit', async (e) => {
                console.log('Form submit event fired!');
                e.preventDefault();

                const armyListText = document.getElementById('osjonesArmyList').value.trim();
                console.log('Army list text:', armyListText);

                if (!armyListText) {
                    alert('Please paste your army list');
                    return;
                }

                showLoading('osjonesLoading');
                hideResults('osjonesResults');

                try {
                    console.log('Calling API...');
                    const response = await fetch(`${API_URL}/api/datacards/osjones`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ army_list_text: armyListText })
                    });

                    const data = await response.json();
                    console.log('API response:', data);

                    hideLoading('osjonesLoading');
                    showResults('osjonesResults', data, response.ok);
                } catch (error) {
                    console.error('API error:', error);
                    hideLoading('osjonesLoading');
                    showResults('osjonesResults', { error: error.message }, false);
                }
            });

            console.log('Event listener attached');
        });

        console.log('Script loaded');
    </script>
</body>
</html>
