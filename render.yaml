services:
  - type: web
    name: north-africa-toe-api
    env: python
    region: oregon
    plan: free
    branch: main
    buildCommand: "cd scripts/battlegroup/web && pip install -r requirements.txt"
    startCommand: "cd scripts/battlegroup/web && python railway_app_with_upload.py"
    disk:
      name: database-disk
      mountPath: /opt/render/project/src/scripts/battlegroup/web/database
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: PORT
        sync: false
