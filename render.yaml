services:
  - type: web
    name: north-africa-toe-api
    env: python
    region: oregon
    plan: free
    branch: main
    buildCommand: "pip install -r scripts/battlegroup/web/requirements.txt && python scripts/database/restore_equipment_table.py"
    startCommand: "cd scripts/battlegroup/web && python railway_app.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: PORT
        sync: false
