[book]
title = "Siege of Tobruk"
description = "British offensive to relieve Tobruk meets devastating German 88mm anti-tank guns"
authors = ["North Africa TO&E Builder", "Claude Code"]
language = "en"
multilingual = false
src = "src"

[build]
build-dir = "book"
create-missing = true

[output.html]
default-theme = "rust"
preferred-dark-theme = "navy"
git-repository-url = ""
git-repository-icon = "fa-github"

[output.html.print]
enable = true

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3
copy-js = true

[preprocessor.index]
enable = true

[preprocessor.links]
enable = true
