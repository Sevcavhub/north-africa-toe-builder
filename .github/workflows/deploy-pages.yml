name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'books/**'
      - 'index.html'
      - 'tools.html'
      - 'builder.html'
      - 'army-list.html'
      - 'styles.css'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Copy root HTML files to books directory
        run: |
          cp index.html books/ || true
          cp tools.html books/ || true
          cp builder.html books/ || true
          cp army-list.html books/ || true
          cp styles.css books/ || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './books'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
