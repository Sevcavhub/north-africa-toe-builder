[book]
title = "Kursk_Test - BattleGroup North Africa"
author = "Generated from Primary Sources"
description = "Historical Scenarios and Army Lists"
language = "en"

[build]
build-dir = "book"

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/yourusername/north-africa-toe-builder"
edit-url-template = "https://github.com/yourusername/north-africa-toe-builder/edit/main/{{path}}"

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3

[output.html.print]
enable = true
